[project]
name = "insightface-service"
version = "0.1.0"
description = "InsightFace buffalo_l 人脸模型服务"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "numpy>=1.24",
    "insightface>=0.7.3",
    "onnxruntime>=1.17",
    "opencv-python>=4.9",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "aliyun-pypi"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true