[project]
name = "ai-gateway"
version = "0.1.0"
description = "DredgeAI AI 推理网关：消费 angineer-ai-inference，提供 chat / SSE 流式，负责用量上报。"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "angineer-ai-inference>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "aliyun-pypi"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[[tool.uv.index]]
name = "tuna-pypi"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
default = false
