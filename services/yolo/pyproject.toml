[project]
name = "yolo-service"
version = "0.1.0"
description = "YOLOv8n 人数统计模型服务"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "numpy>=1.24",
  "opencv-python>=4.9",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "ultralytics>=8.2",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.uv.index]]
name = "aliyun-pypi"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
