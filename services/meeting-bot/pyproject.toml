[project]
name = "meeting-bot"
version = "0.1.0"
description = "AI晨会语音/视觉服务（ASR/TTS/人脸/人数/转写）"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.4", "python-multipart>=0.0.9"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
models = [
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "fireredasr>=0.0.2",
    "insightface>=0.7.3",
    "onnxruntime>=1.17",
    "ultralytics>=8.2",
    "opencv-python>=4.9",
    "huggingface-hub>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
