[project]
name = "meeting-bot"
version = "0.1.0"
description = "AI晨会语音/视觉服务（ASR/TTS/人脸/人数/转写）"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.4"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
