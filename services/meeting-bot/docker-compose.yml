# AI 晨会模型服务「一模型一容器」编排
# 前置：模型权重位于宿主 D:/AI/AImodles（models/ 与 cosyvoice/）；Docker Desktop 已启用 NVIDIA runtime
services:
  sensevoice:
    build: ../sensevoice
    image: sensevoice:dev
    container_name: sensevoice
    ports:
      - "8102:8102"
    environment:
      MEETING_BOT_KEY: dev-key
      MODEL_DIR: /app/models
      ASR_DEVICE: cpu
    volumes:
      - D:/AI/AImodles/models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "X-Meeting-Bot-Key: dev-key", "http://localhost:8102/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  cosyvoice:
    build: ../cosyvoice
    image: cosyvoice:dev
    container_name: cosyvoice
    ports:
      - "8000:8000"
    environment:
      MEETING_BOT_KEY: dev-key
      COSYVOICE_DATA: /data
      MODELSCOPE_CACHE: /data/modelscope
      TTS_VOICE_ID: zh-male-news
    volumes:
      - D:/AI/AImodles/cosyvoice:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Meeting-Bot-Key: dev-key' http://localhost:8000/api/health | grep -q '\"model_loaded\":true'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  insightface:
    build: ../insightface
    image: insightface:dev
    container_name: insightface
    ports:
      - "8103:8103"
    environment:
      MEETING_BOT_KEY: dev-key
      MODEL_DIR: /app/models
      FACE_PROVIDERS: cpu
      FACE_RECOGNIZE_THRESHOLD: 0.55
    volumes:
      - D:/AI/AImodles/models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "X-Meeting-Bot-Key: dev-key", "http://localhost:8103/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  yolo:
    build: ../yolo
    image: yolo:dev
    container_name: yolo
    ports:
      - "8104:8104"
    environment:
      MEETING_BOT_KEY: dev-key
      MODEL_DIR: /app/models
      COUNT_DEVICE: cpu
    volumes:
      - D:/AI/AImodles/models:/app/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "X-Meeting-Bot-Key: dev-key", "http://localhost:8104/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  meeting-bot:
    build: .
    image: meeting-bot:dev
    container_name: meeting-bot
    ports:
      - "8101:8101"
    environment:
      MEETING_BOT_KEY: dev-key
      SENSEVOICE_URL: http://sensevoice:8102
      COSYVOICE_URL: http://cosyvoice:8000
      INSIGHTFACE_URL: http://insightface:8103
      YOLO_URL: http://yolo:8104
      TTS_VOICE_ID: zh-male-news
    depends_on:
      sensevoice:
        condition: service_healthy
      cosyvoice:
        condition: service_healthy
      insightface:
        condition: service_healthy
      yolo:
        condition: service_healthy
    restart: unless-stopped
