name: Release Notify

# 只在推 master 时通知（一次推送一条）：发版由 pnpm release 同时推 master 与 v* tag，
# 若 tag 也触发就会重复，因此 tag 不单独通知；需要补发时用 workflow_dispatch。
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Notify WeCom group
        env:
          WEBHOOK: ${{ secrets.WECOM_WEBHOOK_URL }}
          PREV_SHA: ${{ github.event.before }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/webhook_notify.py
